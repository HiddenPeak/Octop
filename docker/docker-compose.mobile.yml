# =============================================================================
# inhere-box — Remote Phone (mobile) compose overlay for local / DinD testing
#
# Usage (from repo root):
#   # once: download platform-tools next to the repo
#   mkdir -p .tools && cd /tmp && curl -fsSL -o pt.zip \
#     https://dl.google.com/android/repository/platform-tools-latest-linux.zip \
#     && unzip -qo pt.zip -d /workspace/inhere-box/.tools
#
#   docker compose -f docker/docker-compose.mobile.yml up -d --build
#
# This file is standalone (not an overlay) because ``network_mode: host``
# conflicts with published ``ports`` from the base compose file.
#
# Host prerequisites:
# - Docker socket usable by the container
# - /dev/binder or /dev/binderfs on the host
# - Enough free disk for the Redroid image
# =============================================================================

services:
  inhere-box:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: inhere-box:latest
    container_name: inhere-box
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    privileged: true
    network_mode: host
    volumes:
      - ${INHERE_BOX_DATA:-~/.inhere-box}:/data/.inhere-box
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev/binderfs:/dev/binderfs
      - ${INHERE_BOX_PLATFORM_TOOLS:-../.tools/platform-tools}:/opt/android-sdk/platform-tools:ro
    environment:
      - HOME=/data
      - INHERE_BOX_BIND_HOST=0.0.0.0
      - INHERE_BOX_PORT=${INHERE_BOX_PORT:-8088}
      - INHERE_BOX_LOG_LEVEL=${INHERE_BOX_LOG_LEVEL:-info}
      - INHERE_BOX_DEFAULT_PASSWORD=${INHERE_BOX_DEFAULT_PASSWORD:-}
      - INHERE_BOX_ADMIN_USERNAME=${INHERE_BOX_ADMIN_USERNAME:-admin}
      - INHERE_BOX_MOBILE_ADB_HOST=${INHERE_BOX_MOBILE_ADB_HOST:-127.0.0.1:5555}
      - INHERE_BOX_MOBILE_CONTAINER=${INHERE_BOX_MOBILE_CONTAINER:-inhere-box-mobile-android}
      - INHERE_BOX_ENABLE_MOBILE=${INHERE_BOX_ENABLE_MOBILE:-1}
      - ANDROID_HOME=/opt/android-sdk
      - ANDROID_SDK_ROOT=/opt/android-sdk
