# =============================================================================
# inhere-box — Docker Compose
#
# 用法（在仓库根目录执行）:
#   docker compose -f docker/docker-compose.yml up -d
#   INHERE_BOX_PORT=9090 docker compose -f docker/docker-compose.yml up -d
#   INHERE_BOX_DEFAULT_PASSWORD=<your-strong-password> docker compose -f docker/docker-compose.yml up -d
#
# 可在 docker/ 目录放置 .env 文件，例如:
#   INHERE_BOX_PORT=9090
#   INHERE_BOX_DEFAULT_PASSWORD=<your-strong-password>
#   INHERE_BOX_ADMIN_USERNAME=admin
#   INHERE_BOX_DATABASE_DRIVER=postgresql
#   INHERE_BOX_DATABASE_URL=postgresql://inhere-box:inhere-box@host.docker.internal:5432/inhere-box
#
# 注意: docker/.env 仅用于 Compose 插值；变量必须列在下方 environment
# 才会进入容器。也可写入数据卷内的 ~/.inhere-box/env（宿主机挂载目录下的 env）。
# 密码须 ≥8 位且同时包含字母与数字（与控制台改密策略一致）。
# 未设置或密码未通过策略时进入设置向导，口令写入数据卷 inhere-box-login.txt。
# =============================================================================

services:
  inhere-box:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: inhere-box:latest
    container_name: inhere-box
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "${INHERE_BOX_PORT:-8088}:${INHERE_BOX_PORT:-8088}"
    volumes:
      - ${INHERE_BOX_DATA:-~/.inhere-box}:/data/.inhere-box
    environment:
      - HOME=/data
      - INHERE_BOX_BIND_HOST=0.0.0.0
      - INHERE_BOX_PORT=${INHERE_BOX_PORT:-8088}
      - INHERE_BOX_LOG_LEVEL=${INHERE_BOX_LOG_LEVEL:-info}
      - INHERE_BOX_DEFAULT_PASSWORD=${INHERE_BOX_DEFAULT_PASSWORD:-}
      - INHERE_BOX_ADMIN_USERNAME=${INHERE_BOX_ADMIN_USERNAME:-admin}
      - INHERE_BOX_ADMIN_DISPLAY_NAME=${INHERE_BOX_ADMIN_DISPLAY_NAME:-Admin}
      - INHERE_BOX_DATABASE_URL=${INHERE_BOX_DATABASE_URL:-}
      - INHERE_BOX_DATABASE_DRIVER=${INHERE_BOX_DATABASE_DRIVER:-}
      - INHERE_BOX_DATABASE_SQLITE_PATH=${INHERE_BOX_DATABASE_SQLITE_PATH:-}
      - INHERE_BOX_DATABASE_HOST=${INHERE_BOX_DATABASE_HOST:-}
      - INHERE_BOX_DATABASE_PORT=${INHERE_BOX_DATABASE_PORT:-}
      - INHERE_BOX_DATABASE_NAME=${INHERE_BOX_DATABASE_NAME:-}
      - INHERE_BOX_DATABASE_USER=${INHERE_BOX_DATABASE_USER:-}
      - INHERE_BOX_DATABASE_PASSWORD=${INHERE_BOX_DATABASE_PASSWORD:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - LANGFUSE_TRACING_ENABLED=${LANGFUSE_TRACING_ENABLED:-true}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL:-}
